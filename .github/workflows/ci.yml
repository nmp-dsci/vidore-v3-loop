name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    # No key and no CLI login: every test is offline and reads no dataset.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - run: uv run ruff check --no-fix src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q
