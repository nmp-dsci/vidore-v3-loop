[project]
name = "vidore-v3-loop"
version = "0.1.0"
description = "A visual-document RAG system for ViDoRe V3 — retrieve the pages, answer the question — with a scored, versioned, self-improving eval loop."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  # ViDoRe V3 lives on the Hugging Face Hub (vidore/vidore_v3_*), each dataset pinned by revision.
  "datasets>=3.2",
  "huggingface-hub>=0.26",
  "pydantic>=2.9",
  "typer>=0.15",
  "rich>=13.9",
  "mlflow>=3.12,<4",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  # the viewer: API + the built frontend, and page images decoded from the corpus parquet
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pillow>=11.0",
  "bm25s>=0.3.11",
  "pystemmer>=3.1.0",
]

[project.optional-dependencies]
# MTEB's own ViDoRe(v3) retrieval benchmark: heavy (torch), only for comparing against the board.
mteb = ["mteb>=2.0"]
# M2's visual channel and reranker: open models run locally (EVIE-4.5B, zerank-2). Heavy;
# `uv sync --extra retrieval`. CI and the offline tests never need it.
retrieval = ["torch>=2.8", "sentence-transformers[image]>=6.0", "transformers>=4.57", "accelerate>=1.0"]

[project.scripts]
vidoreloop = "vidore_loop.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.14.2",
  "mypy>=1.13",
  "types-PyYAML",
  "httpx>=0.27",
  "pytrec-eval-terrier>=0.5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidore_loop"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vidore_loop"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["datasets.*", "mlflow.*", "mteb.*", "pyarrow.*", "huggingface_hub.*", "bm25s.*", "Stemmer", "torch.*", "sentence_transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"
